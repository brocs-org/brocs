    url: https://developers.openai.com/api/docs/deprecations
- id: llmstxt-unowned
  title: 227 install commands pointing at code nobody owns
  org: 120 sites incl. Fortune 500s / research via Ars Technica
  year: 2026
  industry: Cross-industry
  letters:
  - build
  - secure
  - run
  summary: >-
    Researchers scanned 6,214 corporate domains and found 120 llms.txt and llms-full.txt files
    whose setup instructions referenced 227 unregistered packages or domains. They registered
    a handful and hosted phone-home packages; within an hour a Fortune 500 beaconed back,
    followed by dozens more, with parent-process chains showing coding agents (Claude, Codex,
    Hermes) running the installs.
  detail: >-
    No instructions were planted: the files were honest documentation whose referenced names
    were never registered or had lapsed, so anyone could claim them. One vendor's file pointed
    at an npm slot that had already been claimed and filled with live malware (since resolved).
    Endpoint detection saw nothing wrong, correctly by its own lights: a sanctioned package
    manager talking to a sanctioned registry under a sanctioned parent process. The researchers'
    framing generalises: everything an agent reads is input, every input is a potential instruction,
    and almost none of the published corpus carries the integrity guarantees applied to code.
  skipped: >-
    Build first: agent-followed documentation is part of the software supply chain, and install
    targets need the provenance checks any dependency gets. Secure, because tool constraint
    beats model judgment: an agent that cannot fetch-and-execute in one motion is immune to
    the class. Run, because open egress from agent runtimes is what let the phone-homes out;
    the EDR was never asking the right question.
  sources:
  - title: >-
      Ars Technica (Dan Goodin): Claude, Codex, and Hermes installed unowned code inside corporate
      networks
    url: >-
      https://arstechnica.com/security/2026/08/claude-codex-and-hermes-installed-unowned-code-inside-corporate-networks/
