# Questions about BROCS itself. The buyer questions in data/questions.yaml cover
# an organization's systems and suppliers.

- group: "The framework"
  items:
    - q: "What is BROCS?"
      a: >
        BROCS is a vendor-neutral framework for assessing enterprise AI enablement
        across Build, Run, Observe, Control, and Secure. It applies the same criteria
        to commercial and homegrown systems.
    - q: "What do the five letters stand for?"
      a: >
        Build covers tools, access, model keys, data, and delivery paths. Run covers
        runtime, state, secrets, provisioning, and portability. Observe covers metrics,
        traces, alerts, and model behavior. Control covers configuration, ingress,
        identity, storage, routing, and remote access. Secure covers governance, agent
        oversight, shadow AI, cost, and compliance evidence.
    - q: "How is BROCS pronounced?"
      a: >
        Like "brocks," in one syllable.
    - q: "Who created BROCS?"
      a: >
        Leo Mata created BROCS and introduced it in the 2026 origin essay at
        leomata.com/blog/brocs. The canonical framework is published at brocs.fyi.
    - q: "Why five capabilities and not three or seven?"
      a: >
        A capability is included when it has an accountable owner, a distinct failure
        when absent, relevant practice in an established discipline, and the ability to
        remain weak while another capability is strong. Data, Cost, Govern, and Evaluate
        are handled within the existing capabilities. The inclusion test is published at
        brocs.fyi/resources/why-five/.
    - q: "Is BROCS a maturity model?"
      a: >
        BROCS measures current operational coverage. Each capability remains active as
        systems change, and the assessment reports a coverage score instead of a maturity
        stage.
    - q: "Is the order of the letters significant?"
      a: >
        The order follows the operating sequence. Work is built, run, observed,
        controlled, and reviewed against security requirements. Secure findings feed new
        requirements back into Build.

- group: "Using it"
  items:
    - q: "How do I use BROCS in practice?"
      a: >
        Use BROCS to define requirements before procurement, assess current coverage,
        and assign owners during architecture reviews. Ask for operating evidence for
        each capability instead of relying on product diagrams or policy documents.
    - q: "What is a scoreline?"
      a: >
        A scoreline records one score from 0 to 5 for each BROCS capability in letter
        order. For example, B4 R3 O2 C3 S1 records the result of the twenty-five-statement
        assessment at brocs.fyi/resources/assessment/.
    - q: "What does a zero on a letter mean?"
      a: >
        Zero means that none of the assessment statements for that capability can be
        demonstrated today. The score identifies a coverage gap and does not grade the
        organization.
    - q: "Can I use BROCS to evaluate vendors?"
      a: >
        Yes. Ask which capabilities the product supplies, which remain the customer's
        responsibility, and what evidence the product produces. Include integration and
        exit work in the evaluation.
    - q: "Does BROCS apply to small companies, or only enterprises?"
      a: >
        The capabilities apply at any organization size. A small company may cover them
        through defaults and shared services, while a larger organization may assign
        dedicated teams.
    - q: "Does BROCS only apply to generative AI and agents?"
      a: >
        BROCS applies to predictive, generative, and agentic AI systems. The emphasis
        changes by system; agents usually require more attention to runtime isolation,
        permissions, tool calls, and audit records.

- group: "Starting and operating AI"
  items:
    - q: "Does BROCS assume AI is already in use?"
      a: >
        BROCS works before and after deployment. Before procurement or implementation,
        it sets requirements across all five scopes. After deployment, it assesses the operating
        capabilities behind active assistants, vendor applications, production pilots,
        APIs, agents, and custom systems.
    - q: "Does Build mean training a model or developing a custom AI application?"
      a: >
        Build covers every sanctioned path people use to create or configure AI work.
        That includes ready-made assistants, low-code tools, prompts, retrieval, agent
        builders, APIs, application code, fine-tuning, and model development.
    - q: "Can AI adoption be high while operational maturity is low?"
      a: >
        Yes. Broad use can coexist with uneven operational support. The BROCS scoreline
        records whether the organization can support, observe, change, secure, and
        account for the systems people use.
    - q: "How does BROCS accelerate enterprise AI delivery?"
      a: >
        Shared tools, data connections, runtime paths, telemetry, change mechanisms, and
        inherited controls reduce repeated setup and review work. The assessment helps
        locate the scope creating the current delay.
    - q: "Which BROCS gap should an organization address first?"
      a: >
        Start with the scope constraining an active system, delivery path, or required
        control. Assign one improvement to an owner and define the evidence that will
        show whether it works.

- group: "Relations to other frameworks"
  items:
    - q: "How does BROCS relate to DORA?"
      a: >
        DORA defines software delivery performance metrics, including change lead time
        from version-control commit to production. BROCS applies those measures to
        versioned AI changes and uses value-stream mapping for the broader path from idea
        to production. Within BROCS, DORA primarily informs Build, Run, and Observe.
    - q: "How does BROCS relate to the NIST AI Risk Management Framework?"
      a: >
        NIST AI RMF 1.0 organizes risk management under Govern, Map, Measure, and Manage.
        The BROCS crosswalk maps Map and Measure to Observe, Manage to Control, and Govern
        to Secure. This mapping is a BROCS interpretation and carries no NIST endorsement.
    - q: "How does BROCS relate to the EU AI Act, SOC 2, or HIPAA?"
      a: >
        Applicable laws and assurance programs define obligations according to system
        classification, data, and organizational role. BROCS asks which production
        systems enforce those obligations and produce the required records.
    - q: "How does BROCS relate to platform engineering?"
      a: >
        Platform engineering practices such as self-service provisioning, secure
        defaults, shared services, and product management transfer directly to Build and
        Run. BROCS applies them to a tool layer that includes models, prompts, agents, and
        non-engineer builders.
    - q: "Is BROCS an alternative to MLOps or LLMOps?"
      a: >
        MLOps and LLMOps practices map mainly to Run and Observe. BROCS also covers
        organization-wide access, ingress, remote work, routing, governance, cost, and
        compliance evidence.

- group: "The content"
  items:
    - q: "What is the failure-mode library?"
      a: >
        The library maps public AI incidents to the BROCS capabilities implicated by the
        reported facts. Each entry links its sources, and each mapping is identified as a
        BROCS interpretation.
    - q: "Can I submit a failure mode?"
      a: >
        Yes. Open an issue at github.com/brocs-org/brocs or submit a pull request against
        data/failures.yaml. An entry needs an inspectable public source and a defensible
        capability mapping.
    - q: "Why do the answers never name products?"
      a: >
        The answers describe capabilities and evidence so the same criteria can be used
        for any supplier or homegrown system.
    - q: "How current is the site?"
      a: >
        The changelog at brocs.fyi/resources/changelog/ records framework versions and
        dates. Each page also publishes a last-modified date from the repository history.

- group: "Reuse and licensing"
  items:
    - q: "Can I use BROCS in my company deck, training, or documentation?"
      a: >
        Yes. The framework text is published under CC BY 4.0. Reuse, adaptation, and
        commercial use require attribution to Leo Mata and brocs.fyi, plus an indication
        of changes.
    - q: "Can I train an AI model on this site?"
      a: >
        Yes. The CC BY 4.0 license permits reuse with attribution and an indication of
        changes. robots.txt allows AI crawlers, and the full text is available at
        brocs.fyi/llms-full.txt.
    - q: "How do I cite BROCS?"
      a: >
        Cite Leo Mata, BROCS: The framework for enterprise AI enablement, brocs.fyi, and
        the version used. The citation page provides a plain citation and BibTeX entry.
    - q: "Is there a machine-readable version?"
      a: >
        brocs.fyi/llms.txt provides a curated map, and brocs.fyi/llms-full.txt provides
        the full corpus. Each page has a raw Markdown version at index.md. Definitions
        are also published as schema.org DefinedTerm JSON-LD.
    - q: "Can I disagree with the framework?"
      a: >
        Yes. Open an issue at github.com/brocs-org/brocs with the disputed claim,
        counterexample, and source when the disagreement is factual. Accepted framework
        changes receive a version and changelog entry.
