# The five BROCS capabilities. Single source of truth for the nav, the capability
# diagram, the assessment, the letter tags, and llms.txt generation.
# Colors live here so the diagram, tags, and scoreline never drift apart.
- key: build
  letter: B
  name: Build
  tagline: "Provide approved tools and delivery paths."
  blurb: "Tools, access, models, and data for technical and non-technical builders."
  roots: "DevOps, DORA, platform engineering"
  handoff: run
  verticals:
    - "Tooling: IDEs, agent CLIs, notebooks, chat applications"
    - "Access: who gets which tools, and how fast"
    - "Keys and models: distribution, scoping, rotation, BYOK"
    - "Data access: without handing out production credentials"
    - "Idea to production: golden paths, templates, scaffolds"
- key: run
  letter: R
  name: Run
  tagline: "Operate AI workloads reliably."
  blurb: "Runtime, state, secrets, provisioning, and placement across approved environments."
  roots: "SRE, PaaS, hybrid cloud"
  handoff: observe
  verticals:
    - "Runtime: where apps and agents actually execute"
    - "Data and state: provisioned, owned, backed up"
    - "Secrets: injected at runtime, never in code or chat"
    - "Provisioning: self-service, provision-build-deploy as one motion"
    - "Portability: the runtime goes where the data goes"
- key: observe
  letter: O
  name: Observe
  tagline: "Measure system behavior and quality."
  blurb: "Metrics, traces, evals, and alerts for service owners."
  roots: "Observability, control theory"
  handoff: control
  verticals:
    - "Metrics: golden signals plus tokens, cost, tool calls"
    - "Traces: reconstruct what an agent did, with what, on what data"
    - "Alerts: routed to the builder who owns the app"
    - "Useful signals: decision-linked metrics and alert criteria"
    - "Model behavior: drift, unannounced provider updates, quality regressions"
- key: control
  letter: C
  name: Control
  tagline: "Manage change and access."
  blurb: "Versioned configuration, ingress, identity, storage, routing, and remote access."
  roots: "Control theory, ClickOps to GitOps"
  handoff: secure
  verticals:
    - "Configuration: declarative, versioned, reviewed, reversible"
    - "Ingress: a shared entry point for internal AI apps"
    - "Identity: SSO by default, external access without VPN sprawl"
    - "Storage and backups: retention, lifecycle, restore drills"
    - "Routing: model and provider routing, pinning, failover"
    - "Remote access: work reaches the data instead of the data reaching the laptop"
- key: secure
  letter: S
  name: Secure
  tagline: "Enforce policy and produce evidence."
  blurb: "Governance, agent permissions, cost controls, incident records, and compliance evidence."
  roots: "SecOps, GRC, FinOps"
  handoff: build
  verticals:
    - "Governance: policy tied to enforcement points"
    - "Agents: tool permissions, audit trails, human in the loop"
    - "Shadow AI: discovery of unsanctioned tools and personal accounts"
    - "Cost: who spends what, on which model, showback and chargeback"
    - "Compliance: HIPAA, SOC 2, PCI, FedRAMP, EU AI Act as platform output"
